<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urdu/Sindhi Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">۰</div>
    <div class="buttons">
      <button class="btn" data-value="۷">۷</button>
      <button class="btn" data-value="۸">۸</button>
      <button class="btn" data-value="۹">۹</button>
      <button class="btn operator" data-value="/">٪</button>
      <button class="btn" data-value="۴">۴</button>
      <button class="btn" data-value="۵">۵</button>
      <button class="btn" data-value="۶">۶</button>
      <button class="btn operator" data-value="-">−</button>
      <button class="btn" data-value="۱">۱</button>
      <button class="btn" data-value="۲">۲</button>
      <button class="btn" data-value="۳">۳</button>
      <button class="btn operator" data-value="+">+</button>
      <button class="btn" data-value="۰">۰</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn" data-value="C">صاف</button>
      <button class="btn operator" data-value="*">×</button>
      <button class="btn operator" data-value="=">برابر</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
